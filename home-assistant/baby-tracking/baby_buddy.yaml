# ==============================================================================
# EXTERNAL SYNC - HAPPIEST BABY & LILLIO
# ==============================================================================
# Automated syncs from external baby tracking services to Baby Buddy
# - Happiest Baby: Sleep data from SNOO bassinet (every 3 hours)
# - Lillio: Daycare reports - naps, feedings, diapers (5/6/7 PM weekdays)
#
# Scripts output JSON parsed by command_line sensors for status tracking
# Manual sync available via shell_command service calls

# ------------------------------------------------------------------------------
# Shell Commands - Scripts read credentials directly from /config/secrets.yaml
# ------------------------------------------------------------------------------
shell_command:
  # Sync Happiest Baby sleep data (default 1 day lookback)
  sync_happiest_baby: "python /config/scripts/sync_happiest_baby.py"

  # Sync Happiest Baby with configurable lookback (set via input_number.happiest_baby_backfill_days)
  sync_happiest_baby_backfill: "python /config/scripts/sync_happiest_baby.py --lookback-days {{ states('input_number.happiest_baby_backfill_days') | int }}"

  # Sync Lillio daily reports
  sync_lillio: "python /config/scripts/sync_lillio.py"

# ------------------------------------------------------------------------------
# Note: Sync status tracked via input_text helpers updated by scripts
# command_line sensors removed - can't pass templated secrets to them
# ------------------------------------------------------------------------------

input_number:
  happiest_baby_backfill_days:
    name: Happiest Baby Backfill Days
    min: 1
    max: 90
    step: 1
    initial: 7
    unit_of_measurement: days
    icon: mdi:calendar-range

  baby_date_offset:
    name: Baby Date Offset
    min: -6
    max: 0
    step: 1
    initial: 0
    mode: box
    icon: mdi:calendar-range

input_datetime:
  happiest_baby_last_sync:
    name: Happiest Baby Last Sync
    has_date: true
    has_time: true
    icon: mdi:clock-check

  lillio_last_sync:
    name: Lillio Last Sync
    has_date: true
    has_time: true
    icon: mdi:clock-check

# ------------------------------------------------------------------------------
# Scripts - Popup triggers with date reset
# These scripts reset date navigation to today before opening popups
# ------------------------------------------------------------------------------
script:
  # Open Diaper History popup, resetting to today first
  baby_open_diaper_history:
    alias: "Open Diaper History (Reset to Today)"
    description: "Reset date offset to 0 (today) then trigger Diaper History popup"
    sequence:
      - service: input_number.set_value
        target:
          entity_id: input_number.baby_date_offset
        data:
          value: 0
      - service: input_boolean.turn_on
        target:
          entity_id: input_boolean.open_diaper_history
      - delay:
          milliseconds: 500
      - service: input_boolean.turn_off
        target:
          entity_id: input_boolean.open_diaper_history

  # Open Feeding History popup, resetting to today first
  baby_open_feeding_history:
    alias: "Open Feeding History (Reset to Today)"
    description: "Reset date offset to 0 (today) then trigger Feeding History popup"
    sequence:
      - service: input_number.set_value
        target:
          entity_id: input_number.baby_date_offset
        data:
          value: 0
      - service: input_boolean.turn_on
        target:
          entity_id: input_boolean.open_feeding_history
      - delay:
          milliseconds: 500
      - service: input_boolean.turn_off
        target:
          entity_id: input_boolean.open_feeding_history

  # Open Sleep History popup, resetting to today first
  baby_open_sleep_history:
    alias: "Open Sleep History (Reset to Today)"
    description: "Reset date offset to 0 (today) then trigger Sleep History popup"
    sequence:
      - service: input_number.set_value
        target:
          entity_id: input_number.baby_date_offset
        data:
          value: 0
      - service: input_boolean.turn_on
        target:
          entity_id: input_boolean.open_sleep_history
      - delay:
          milliseconds: 500
      - service: input_boolean.turn_off
        target:
          entity_id: input_boolean.open_sleep_history

# ------------------------------------------------------------------------------
# Scripts - Sync with status update
# Scripts read credentials directly from /config/secrets.yaml
# ------------------------------------------------------------------------------

  # Manual Happiest Baby sync with status update
  sync_happiest_baby_manual:
    alias: "Sync Happiest Baby"
    description: "Manually trigger Happiest Baby sync and update status"
    sequence:
      - service: shell_command.sync_happiest_baby
      - delay:
          seconds: 5
      - service: input_datetime.set_datetime
        target:
          entity_id: input_datetime.happiest_baby_last_sync
        data:
          datetime: "{{ now().strftime('%Y-%m-%d %H:%M:%S') }}"
      - service: input_text.set_value
        target:
          entity_id: input_text.happiest_baby_last_status
        data:
          value: "Synced"

  # Happiest Baby backfill - configurable days via input_number
  sync_happiest_baby_backfill:
    alias: "Sync Happiest Baby (Backfill)"
    description: "Backfill sync - set days via input_number.happiest_baby_backfill_days"
    sequence:
      - service: shell_command.sync_happiest_baby_backfill
      - delay:
          seconds: 10
      - service: input_datetime.set_datetime
        target:
          entity_id: input_datetime.happiest_baby_last_sync
        data:
          datetime: "{{ now().strftime('%Y-%m-%d %H:%M:%S') }}"
      - service: input_text.set_value
        target:
          entity_id: input_text.happiest_baby_last_status
        data:
          value: "Backfill complete"

  # Manual Lillio sync with status update
  sync_lillio_manual:
    alias: "Sync Lillio"
    description: "Manually trigger Lillio sync and update status"
    sequence:
      - service: shell_command.sync_lillio
      - delay:
          seconds: 5
      - service: input_datetime.set_datetime
        target:
          entity_id: input_datetime.lillio_last_sync
        data:
          datetime: "{{ now().strftime('%Y-%m-%d %H:%M:%S') }}"
      - service: input_text.set_value
        target:
          entity_id: input_text.lillio_last_status
        data:
          value: "Synced"

# ------------------------------------------------------------------------------
# Automations - Scheduled syncs
# ------------------------------------------------------------------------------
automation:
  # Happiest Baby - Every 3 hours, 24/7
  - id: sync_happiest_baby_scheduled
    alias: "Sync Happiest Baby (Scheduled)"
    description: "Sync sleep data from Happiest Baby every 3 hours"
    trigger:
      - platform: time_pattern
        hours: "/3"  # Every 3 hours: 0, 3, 6, 9, 12, 15, 18, 21
    action:
      - service: script.sync_happiest_baby_manual

  # Lillio - 5 PM, 6 PM, 7 PM weekdays only
  - id: sync_lillio_scheduled
    alias: "Sync Lillio (Scheduled)"
    description: "Sync daycare reports at 5, 6, 7 PM on weekdays"
    trigger:
      - platform: time
        at: "17:00:00"
      - platform: time
        at: "18:00:00"
      - platform: time
        at: "19:00:00"
    condition:
      - condition: time
        weekday:
          - mon
          - tue
          - wed
          - thu
          - fri
    action:
      - service: script.sync_lillio_manual

  # Sync failure notification
  - id: sync_failure_notification
    alias: "Baby Sync Failure Alert"
    description: "Notify on sync failures"
    trigger:
      - platform: state
        entity_id: sensor.happiest_baby_sync
        to: "Error"
    action:
      - service: persistent_notification.create
        data:
          title: "Baby Sync Failed"
          message: >
            Happiest Baby sync failed: {{ state_attr('sensor.happiest_baby_sync', 'error') }}
          notification_id: baby_sync_error
