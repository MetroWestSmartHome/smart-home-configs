# Baby Buddy Dashboard View for Home Assistant
# Full tutorial: https://metrowestsmarthome.com/happiest-baby-home-assistant/
#
# This is a single Lovelace view to add to your dashboard.
# Add this view to your existing dashboard YAML or use as a standalone dashboard.
#
# Prerequisites:
# - baby_buddy.yaml package installed (REST sensors, template sensors, scripts, automations)
# - HACS custom cards: Bubble Card, Mushroom Cards, ApexCharts Card, Layout Card, Stack-in-Card
#
# Replace these placeholders:
# - Your Baby / your_baby -> Your baby's name (display / entity IDs)
# - YOUR_HA_IP -> Your Home Assistant IP or hostname (for Baby Buddy links)
#
# Source tags in notes field identify data origin:
# - [HB] = Synced from Happiest Baby
# - [LI] = Synced from Lillio (daycare)
# - No tag = Logged manually
  # ==========================================================================
  # VIEW 8: BABY (YOUR_BABY Tracking)
  # ==========================================================================
  - title: Baby
    path: baby
    icon: mdi:baby-face-outline
    theme: Catppuccin Macchiato Rounded
    layout:
      max_cols: 3
    cards:
      # --------------------------------------------------------------------------
      # BABY STATUS CARD
      # --------------------------------------------------------------------------
      - type: custom:stack-in-card
        cards:
          - type: custom:mushroom-template-card
            primary: Your Baby
            secondary: "{{ states('sensor.your_baby_age') }} months old"
            icon: mdi:baby-face
            icon_color: blue
            badge_icon: mdi:menu
            tap_action:
              action: navigate
              navigation_path: '#baby-details'
          # Row 1: Last Bottle, Last Solid
          - type: horizontal-stack
            cards:
              - type: custom:mushroom-template-card
                primary: >
                  {% if is_state('input_boolean.baby_display_imperial', 'on') %}
                    {{ states('sensor.your_baby_last_bottle_oz') }} oz
                  {% else %}
                    {{ states('sensor.your_baby_last_bottle_ml') }} ml
                  {% endif %}
                secondary: >
                  {% set time = state_attr('sensor.your_baby_last_bottle_ml', 'time') %}
                  {% if time %}
                    {% set hours = ((now() - (time | as_datetime)).total_seconds() / 3600) | round(1) %}
                    {{ hours }}h ago
                  {% endif %}
                icon: mdi:baby-bottle
                icon_color: blue
                layout: vertical
                tap_action:
                  action: navigate
                  navigation_path: '#edit-last-bottle'
              - type: custom:mushroom-template-card
                primary: >
                  {% set food_raw = state_attr('sensor.your_baby_last_solid', 'food') | default('None') %}
                  {{ food_raw | regex_replace('^\[(HB|LI)\]\s*', '') | truncate(10) }}
                secondary: >
                  {% set time = state_attr('sensor.your_baby_last_solid', 'time') %}
                  {% if time %}
                    {% set hours = ((now() - (time | as_datetime)).total_seconds() / 3600) | round(1) %}
                    {{ hours }}h ago
                  {% else %}
                    --
                  {% endif %}
                icon: mdi:food-apple
                icon_color: green
                layout: vertical
                tap_action:
                  action: navigate
                  navigation_path: '#edit-last-solid'
          # Row 2: Last Diaper, Last Sleep
          - type: horizontal-stack
            cards:
              - type: custom:mushroom-template-card
                primary: "{{ states('sensor.your_baby_last_diaper_type') }}"
                secondary: >
                  {% set time = state_attr('sensor.your_baby_last_diaper_type', 'time') %}
                  {% if time %}
                    {% set hours = ((now() - (time | as_datetime)).total_seconds() / 3600) | round(1) %}
                    {{ hours }}h ago
                  {% endif %}
                icon: mdi:paper-roll
                icon_color: amber
                layout: vertical
                tap_action:
                  action: navigate
                  navigation_path: '#edit-last-diaper'
              - type: custom:mushroom-template-card
                primary: >
                  {% set mins = states('sensor.your_baby_last_sleep') | int(0) %}
                  {% set hours = (mins // 60) | int %}
                  {% set remaining = mins % 60 %}
                  {% if hours > 0 %}{{ hours }}h {{ remaining }}m{% else %}{{ remaining }}m{% endif %}
                secondary: >
                  {% set end_time = state_attr('sensor.your_baby_last_sleep', 'end') %}
                  {% if end_time %}
                    {% set hours = ((now() - (end_time | as_datetime)).total_seconds() / 3600) | round(1) %}
                    {{ hours }}h ago
                  {% endif %}
                icon: mdi:sleep
                icon_color: purple
                layout: vertical
                tap_action:
                  action: navigate
                  navigation_path: '#edit-last-sleep'

      # --------------------------------------------------------------------------
      # QUICK LOG BUTTONS (open popup forms)
      # --------------------------------------------------------------------------
      - type: custom:stack-in-card
        cards:
          - type: custom:mushroom-template-card
            primary: Quick Log
            icon: mdi:plus-circle
            icon_color: green
          - type: horizontal-stack
            cards:
              - type: custom:mushroom-template-card
                primary: Feeding
                icon: mdi:baby-bottle
                icon_color: blue
                tap_action:
                  action: navigate
                  navigation_path: '#feeding-log'
                layout: vertical
              - type: custom:mushroom-template-card
                primary: Diaper
                icon: mdi:emoticon-poop
                icon_color: amber
                tap_action:
                  action: navigate
                  navigation_path: '#diaper-log'
                layout: vertical
              - type: custom:mushroom-template-card
                primary: Sleep
                icon: mdi:sleep
                icon_color: purple
                tap_action:
                  action: navigate
                  navigation_path: '#sleep-log'
                layout: vertical
              - type: custom:mushroom-template-card
                primary: Growth
                icon: mdi:chart-line
                icon_color: green
                tap_action:
                  action: navigate
                  navigation_path: '#growth-log'
                layout: vertical

      # --------------------------------------------------------------------------
      # TODAY'S FEEDINGS - Summary buttons (tap for full list with date navigation)
      # --------------------------------------------------------------------------
      - type: custom:stack-in-card
        cards:
          - type: custom:mushroom-template-card
            primary: Feedings
            secondary: "{{ states('sensor.your_baby_bottles_today_list') }} bottles, {{ states('sensor.your_baby_solids_today_list') }} solids"
            icon: mdi:baby-bottle-outline
            icon_color: light-blue
            badge_icon: mdi:menu
            tap_action:
              action: call-service
              service: script.baby_open_feeding_history
          # Bottles - Total and Last buttons
          - type: horizontal-stack
            cards:
              - type: custom:mushroom-template-card
                primary: >
                  Total {{ states('sensor.your_baby_bottles_today_list') }}
                secondary: >
                  {% if is_state('input_boolean.baby_display_imperial', 'on') %}
                    {{ states('sensor.your_baby_feedings_today_total_oz') }} oz
                  {% else %}
                    {{ states('sensor.your_baby_feedings_today_total_ml') }} ml
                  {% endif %}
                icon: mdi:baby-bottle
                icon_color: blue
                layout: vertical
                tap_action:
                  action: call-service
                  service: script.baby_open_feeding_history
              - type: custom:mushroom-template-card
                primary: >
                  {% set time = state_attr('sensor.your_baby_last_bottle_ml', 'time') %}
                  {% if time %}
                    {% if is_state('input_boolean.baby_display_imperial', 'on') %}
                      Last {{ states('sensor.your_baby_last_bottle_oz') }} oz
                    {% else %}
                      Last {{ states('sensor.your_baby_last_bottle_ml') }} ml
                    {% endif %}
                  {% else %}
                    No bottles
                  {% endif %}
                secondary: >
                  {% set time = state_attr('sensor.your_baby_last_bottle_ml', 'time') %}
                  {% if time %}
                    {% set item_date = (time | as_datetime | as_local).date() %}
                    {% set today = now().date() %}
                    {% set days_ago = (today - item_date).days %}
                    {% if days_ago == 0 %}
                      @ {{ time | as_datetime | as_local | as_timestamp | timestamp_custom('%I:%M %p') }}
                    {% elif days_ago == 1 %}
                      Yesterday {{ time | as_datetime | as_local | as_timestamp | timestamp_custom('%I:%M %p') }}
                    {% else %}
                      {{ days_ago }} days ago
                    {% endif %}
                  {% endif %}
                icon: mdi:baby-bottle-outline
                icon_color: light-blue
                layout: vertical
                tap_action:
                  action: call-service
                  service: script.baby_open_feeding_history
          # Solids - Total and Last buttons
          - type: horizontal-stack
            cards:
              - type: custom:mushroom-template-card
                primary: "Total {{ states('sensor.your_baby_solids_today_list') }}"
                secondary: solids
                icon: mdi:food-apple
                icon_color: green
                layout: vertical
                tap_action:
                  action: call-service
                  service: script.baby_open_feeding_history
              - type: custom:mushroom-template-card
                primary: >
                  {% set time = state_attr('sensor.your_baby_last_solid', 'time') %}
                  {% if time %}
                    {% set food_raw = state_attr('sensor.your_baby_last_solid', 'food') | default('') %}
                    {% set food = food_raw | regex_replace('^\[(HB|LI)\]\s*', '') | truncate(20) %}
                    Last: {{ food }}
                  {% else %}
                    No solids
                  {% endif %}
                secondary: >
                  {% set time = state_attr('sensor.your_baby_last_solid', 'time') %}
                  {% if time %}
                    {% set item_date = (time | as_datetime | as_local).date() %}
                    {% set today = now().date() %}
                    {% set days_ago = (today - item_date).days %}
                    {% if days_ago == 0 %}
                      @ {{ time | as_datetime | as_local | as_timestamp | timestamp_custom('%I:%M %p') }}
                    {% elif days_ago == 1 %}
                      Yesterday
                    {% else %}
                      {{ days_ago }} days ago
                    {% endif %}
                  {% endif %}
                icon: mdi:food-apple-outline
                icon_color: light-green
                layout: vertical
                tap_action:
                  action: call-service
                  service: script.baby_open_feeding_history

      # --------------------------------------------------------------------------
      # SLEEP TRACKING - Summary buttons (tap for full list with date navigation)
      # --------------------------------------------------------------------------
      - type: custom:stack-in-card
        cards:
          - type: custom:mushroom-template-card
            primary: Sleep
            secondary: "{{ states('sensor.your_baby_sleep_today_count') }} sessions ({{ states('sensor.your_baby_sleep_today_total') }} hr), {{ states('sensor.your_baby_naps_today_count') }} naps"
            icon: mdi:sleep
            icon_color: purple
            badge_icon: mdi:menu
            tap_action:
              action: call-service
              service: script.baby_open_sleep_history
          # Sleep - Total and Last buttons
          - type: horizontal-stack
            cards:
              - type: custom:mushroom-template-card
                primary: "Total {{ states('sensor.your_baby_sleep_today_count') }}"
                secondary: "{{ states('sensor.your_baby_sleep_today_total') }} hr, {{ states('sensor.your_baby_naps_today_count') }} naps"
                icon: mdi:sleep
                icon_color: purple
                layout: vertical
                tap_action:
                  action: call-service
                  service: script.baby_open_sleep_history
              - type: custom:mushroom-template-card
                primary: >
                  {% set end_time = state_attr('sensor.your_baby_last_sleep', 'end') %}
                  {% if end_time %}
                    {% set mins = states('sensor.your_baby_last_sleep') | int(0) %}
                    {% set hours = (mins // 60) | int %}
                    {% set remaining_mins = mins % 60 %}
                    {% if hours > 0 %}
                      Last {{ hours }}h {{ remaining_mins }}m
                    {% else %}
                      Last {{ remaining_mins }}m
                    {% endif %}
                  {% else %}
                    No sleep
                  {% endif %}
                secondary: >
                  {% set end_time = state_attr('sensor.your_baby_last_sleep', 'end') %}
                  {% if end_time %}
                    {% set item_date = (end_time | as_datetime | as_local).date() %}
                    {% set today = now().date() %}
                    {% set days_ago = (today - item_date).days %}
                    {% set nap = state_attr('sensor.your_baby_last_sleep', 'nap') %}
                    {% set nap_text = ' (nap)' if nap == true else '' %}
                    {% if days_ago == 0 %}
                      Ended {{ end_time | as_datetime | as_local | as_timestamp | timestamp_custom('%I:%M %p') }}{{ nap_text }}
                    {% elif days_ago == 1 %}
                      Yesterday{{ nap_text }}
                    {% else %}
                      {{ days_ago }} days ago{{ nap_text }}
                    {% endif %}
                  {% endif %}
                icon: mdi:bed
                icon_color: deep-purple
                layout: vertical
                tap_action:
                  action: call-service
                  service: script.baby_open_sleep_history
          - type: conditional
            conditions:
              - condition: state
                entity: sensor.your_baby_snoo_state
                state_not: unavailable
            card:
              type: tile
              entity: sensor.your_baby_snoo_state
              name: Snoo Status

      # --------------------------------------------------------------------------
      # DIAPER TRACKING - Summary buttons (tap for full list with date navigation)
      # --------------------------------------------------------------------------
      - type: custom:stack-in-card
        cards:
          - type: custom:mushroom-template-card
            primary: Diapers
            secondary: "{{ states('sensor.your_baby_diapers_today_count') }} today"
            icon: mdi:paper-roll
            icon_color: amber
            badge_icon: mdi:menu
            tap_action:
              action: call-service
              service: script.baby_open_diaper_history
          # Diaper - Total and Last Dirty buttons
          - type: horizontal-stack
            cards:
              - type: custom:mushroom-template-card
                primary: "Total {{ states('sensor.your_baby_diapers_today_count') }}"
                secondary: "diapers today"
                icon: mdi:paper-roll
                icon_color: amber
                layout: vertical
                tap_action:
                  action: call-service
                  service: script.baby_open_diaper_history
              - type: custom:mushroom-template-card
                primary: >
                  {% set hours = states('sensor.your_baby_last_dirty_diaper') | float(0) %}
                  {% if hours > 0 %}
                    Last ðŸ’© {{ hours }}h ago
                  {% else %}
                    No dirty today
                  {% endif %}
                secondary: >
                  {% set time = state_attr('sensor.your_baby_last_dirty_diaper', 'time') %}
                  {% if time %}
                    {% set item_date = (time | as_datetime | as_local).date() %}
                    {% set today = now().date() %}
                    {% set days_ago = (today - item_date).days %}
                    {% if days_ago == 0 %}
                      {{ time | as_datetime | as_local | as_timestamp | timestamp_custom('%I:%M %p') }}
                    {% elif days_ago == 1 %}
                      Yesterday
                    {% else %}
                      {{ days_ago }} days ago
                    {% endif %}
                  {% endif %}
                icon: mdi:emoticon-poop
                icon_color: brown
                layout: vertical
                tap_action:
                  action: call-service
                  service: script.baby_open_diaper_history

      # --------------------------------------------------------------------------
      # GROWTH TRACKING
      # --------------------------------------------------------------------------
      - type: custom:stack-in-card
        cards:
          - type: custom:mushroom-template-card
            primary: Growth
            icon: mdi:chart-line
            icon_color: teal
            badge_icon: mdi:menu
            tap_action:
              action: navigate
              navigation_path: '#growth-details'
          - type: horizontal-stack
            cards:
              # Weight with date
              - type: custom:mushroom-template-card
                primary: >
                  {% if is_state('input_boolean.baby_display_imperial', 'on') %}
                    {{ states('sensor.your_baby_last_weight_lb') }} lb
                  {% else %}
                    {{ states('sensor.your_baby_last_weight_kg') }} kg
                  {% endif %}
                secondary: "{{ state_attr('sensor.your_baby_last_weight', 'date') }}"
                icon: mdi:scale-bathroom
                icon_color: green
                layout: vertical
                tap_action:
                  action: navigate
                  navigation_path: '#growth-details'
              # Height with date
              - type: custom:mushroom-template-card
                primary: >
                  {% if is_state('input_boolean.baby_display_imperial', 'on') %}
                    {{ states('sensor.your_baby_last_height_in') }} in
                  {% else %}
                    {{ states('sensor.your_baby_last_height_cm') }} cm
                  {% endif %}
                secondary: "{{ state_attr('sensor.your_baby_last_height', 'date') }}"
                icon: mdi:human-male-height
                icon_color: blue
                layout: vertical
                tap_action:
                  action: navigate
                  navigation_path: '#growth-details'
              # Head circumference with date
              - type: custom:mushroom-template-card
                primary: >
                  {% if is_state('input_boolean.baby_display_imperial', 'on') %}
                    {{ states('sensor.your_baby_last_head_in') }} in
                  {% else %}
                    {{ states('sensor.your_baby_last_head_cm') }} cm
                  {% endif %}
                secondary: "{{ state_attr('sensor.your_baby_last_head_circumference', 'date') }}"
                icon: mdi:head
                icon_color: amber
                layout: vertical
                tap_action:
                  action: navigate
                  navigation_path: '#growth-details'

      # --------------------------------------------------------------------------
      # SETTINGS
      # --------------------------------------------------------------------------
      - type: custom:stack-in-card
        cards:
          - type: custom:mushroom-template-card
            primary: Settings
            icon: mdi:cog
            icon_color: grey
          - type: tile
            entity: input_boolean.baby_display_imperial
            name: Imperial Units (oz/lb)
          - type: custom:mushroom-template-card
            primary: Import/Sync
            icon: mdi:cloud-sync
            icon_color: green
            tap_action:
              action: navigate
              navigation_path: '#baby-settings'

      # --------------------------------------------------------------------------
      # POPUPS
      # --------------------------------------------------------------------------
      # Baby Details Popup
      - type: vertical-stack
        cards:
          - type: custom:bubble-card
            card_type: pop-up
            hash: '#baby-details'
            name: Baby Details
            icon: mdi:baby-face
            width_desktop: 600px
          - type: entities
            title: Last Bottle
            entities:
              - type: conditional
                conditions:
                  - entity: input_boolean.baby_display_imperial
                    state: "off"
                row:
                  entity: sensor.your_baby_last_bottle_ml
                  name: Amount
              - type: conditional
                conditions:
                  - entity: input_boolean.baby_display_imperial
                    state: "on"
                row:
                  entity: sensor.your_baby_last_bottle_oz
                  name: Amount
              - type: attribute
                entity: sensor.your_baby_last_bottle_ml
                attribute: type
                name: Type
              - type: attribute
                entity: sensor.your_baby_last_bottle_ml
                attribute: method
                name: Method
              - type: attribute
                entity: sensor.your_baby_last_bottle_ml
                attribute: time
                name: Time
          - type: entities
            title: Last Solid Food
            entities:
              - entity: sensor.your_baby_last_solid
                name: Food
              - type: attribute
                entity: sensor.your_baby_last_solid
                attribute: method
                name: Method
              - type: attribute
                entity: sensor.your_baby_last_solid
                attribute: time
                name: Time
          - type: entities
            title: Last Diaper
            entities:
              - entity: sensor.your_baby_last_change
                name: Time
              - entity: sensor.your_baby_last_diaper_type
                name: Type
              - type: attribute
                entity: sensor.your_baby_last_diaper_type
                attribute: notes
                name: Notes
          - type: entities
            title: Last Sleep
            entities:
              - entity: sensor.your_baby_last_sleep
                name: Duration
              - type: attribute
                entity: sensor.your_baby_last_sleep
                attribute: start
                name: Start
              - type: attribute
                entity: sensor.your_baby_last_sleep
                attribute: end
                name: End
              - type: attribute
                entity: sensor.your_baby_last_sleep
                attribute: nap
                name: Nap

      # Edit Last Bottle Popup
      # Use case: Log bottle amount upfront, then edit if baby doesn't finish or needs more
      - type: vertical-stack
        cards:
          - type: custom:bubble-card
            card_type: pop-up
            hash: '#edit-last-bottle'
            name: Edit Last Bottle
            icon: mdi:baby-bottle-outline
            width_desktop: 500px
          - type: entities
            title: Current Values
            entities:
              - type: conditional
                conditions:
                  - condition: state
                    entity: input_boolean.baby_display_imperial
                    state: "off"
                row:
                  entity: sensor.your_baby_last_feeding_ml
                  name: Amount
              - type: conditional
                conditions:
                  - condition: state
                    entity: input_boolean.baby_display_imperial
                    state: "on"
                row:
                  entity: sensor.your_baby_last_feeding_oz
                  name: Amount
              - type: attribute
                entity: sensor.your_baby_last_feeding
                attribute: start
                name: Time
              - type: attribute
                entity: sensor.your_baby_last_feeding
                attribute: notes
                name: Notes
          - type: custom:mushroom-title-card
            title: New Amount
            subtitle: >
              {% if is_state('input_boolean.baby_display_imperial', 'on') %}Enter in oz{% else %}Enter in ml{% endif %}
          - type: horizontal-stack
            cards:
              - type: conditional
                conditions:
                  - condition: state
                    entity: input_boolean.baby_display_imperial
                    state: "off"
                card:
                  type: button
                  name: "150 ml"
                  tap_action:
                    action: call-service
                    service: input_text.set_value
                    service_data:
                      entity_id: input_text.baby_edit_feeding_amount_input
                      value: "150"
              - type: conditional
                conditions:
                  - condition: state
                    entity: input_boolean.baby_display_imperial
                    state: "off"
                card:
                  type: button
                  name: "180 ml"
                  tap_action:
                    action: call-service
                    service: input_text.set_value
                    service_data:
                      entity_id: input_text.baby_edit_feeding_amount_input
                      value: "180"
              - type: conditional
                conditions:
                  - condition: state
                    entity: input_boolean.baby_display_imperial
                    state: "off"
                card:
                  type: button
                  name: "210 ml"
                  tap_action:
                    action: call-service
                    service: input_text.set_value
                    service_data:
                      entity_id: input_text.baby_edit_feeding_amount_input
                      value: "210"
              - type: conditional
                conditions:
                  - condition: state
                    entity: input_boolean.baby_display_imperial
                    state: "off"
                card:
                  type: button
                  name: "240 ml"
                  tap_action:
                    action: call-service
                    service: input_text.set_value
                    service_data:
                      entity_id: input_text.baby_edit_feeding_amount_input
                      value: "240"
              - type: conditional
                conditions:
                  - condition: state
                    entity: input_boolean.baby_display_imperial
                    state: "on"
                card:
                  type: button
                  name: "5 oz"
                  tap_action:
                    action: call-service
                    service: input_text.set_value
                    service_data:
                      entity_id: input_text.baby_edit_feeding_amount_input
                      value: "5"
              - type: conditional
                conditions:
                  - condition: state
                    entity: input_boolean.baby_display_imperial
                    state: "on"
                card:
                  type: button
                  name: "6 oz"
                  tap_action:
                    action: call-service
                    service: input_text.set_value
                    service_data:
                      entity_id: input_text.baby_edit_feeding_amount_input
                      value: "6"
              - type: conditional
                conditions:
                  - condition: state
                    entity: input_boolean.baby_display_imperial
                    state: "on"
                card:
                  type: button
                  name: "7 oz"
                  tap_action:
                    action: call-service
                    service: input_text.set_value
                    service_data:
                      entity_id: input_text.baby_edit_feeding_amount_input
                      value: "7"
              - type: conditional
                conditions:
                  - condition: state
                    entity: input_boolean.baby_display_imperial
                    state: "on"
                card:
                  type: button
                  name: "8 oz"
                  tap_action:
                    action: call-service
                    service: input_text.set_value
                    service_data:
                      entity_id: input_text.baby_edit_feeding_amount_input
                      value: "8"
          - type: conditional
            conditions:
              - condition: state
                entity: input_boolean.baby_display_imperial
                state: "on"
            card:
              type: entities
              entities:
                - entity: input_text.baby_edit_feeding_amount_input
                  name: Amount (oz)
                - entity: input_text.baby_edit_feeding_notes
                  name: Notes
          - type: conditional
            conditions:
              - condition: state
                entity: input_boolean.baby_display_imperial
                state: "off"
            card:
              type: entities
              entities:
                - entity: input_text.baby_edit_feeding_amount_input
                  name: Amount (ml)
                - entity: input_text.baby_edit_feeding_notes
                  name: Notes
          - type: horizontal-stack
            cards:
              - type: button
                name: Update Feeding
                icon: mdi:content-save
                tap_action:
                  action: call-service
                  service: script.babybuddy_update_last_feeding
                  confirmation:
                    text: Update feeding?
              - type: grid
                cards: []
              - type: grid
                cards: []

      # Edit Last Solid Popup
      - type: vertical-stack
        cards:
          - type: custom:bubble-card
            card_type: pop-up
            hash: '#edit-last-solid'
