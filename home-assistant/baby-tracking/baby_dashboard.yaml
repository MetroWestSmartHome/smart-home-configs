      # Feedings Popup (with date navigation)
      - type: vertical-stack
        cards:
          - type: custom:bubble-card
            card_type: pop-up
            hash: '#feeding-history'
            name: Feedings
            icon: mdi:baby-bottle-outline
            width_desktop: 600px
            trigger_entity: input_boolean.open_feeding_history
            trigger_state: 'on'
          # Date navigation header
          - type: horizontal-stack
            cards:
              - type: custom:mushroom-template-card
                icon: mdi:chevron-left
                icon_color: >
                  {% if states('input_number.baby_date_offset') | int > -6 %}blue{% else %}disabled{% endif %}
                tap_action:
                  action: call-service
                  service: input_number.decrement
                  target:
                    entity_id: input_number.baby_date_offset
                layout: vertical
              - type: custom:mushroom-template-card
                primary: "{{ states('sensor.baby_selected_date') }}"
                secondary: >
                  {% if state_attr('sensor.baby_selected_date', 'is_today') == 'True' %}Today{% endif %}
                icon: mdi:calendar
                icon_color: blue
                layout: vertical
              - type: custom:mushroom-template-card
                icon: mdi:chevron-right
                icon_color: >
                  {% if states('input_number.baby_date_offset') | int < 0 %}blue{% else %}disabled{% endif %}
                tap_action:
                  action: call-service
                  service: input_number.increment
                  target:
                    entity_id: input_number.baby_date_offset
                layout: vertical
              - type: custom:mushroom-template-card
                primary: Today
                icon: mdi:calendar-today
                icon_color: green
                tap_action:
                  action: call-service
                  service: input_number.set_value
                  target:
                    entity_id: input_number.baby_date_offset
                  data:
                    value: 0
                layout: vertical
          # Selected day summary
          - type: custom:mushroom-template-card
            primary: >
              {% if is_state('input_boolean.baby_display_imperial', 'on') %}
                {{ states('sensor.baby_selected_day_bottles') }} bottles ({{ state_attr('sensor.baby_selected_day_bottles', 'total_oz') }} oz)
              {% else %}
                {{ states('sensor.baby_selected_day_bottles') }} bottles ({{ state_attr('sensor.baby_selected_day_bottles', 'total_ml') }} ml)
              {% endif %}
            secondary: "{{ states('sensor.baby_selected_day_solids') }} solids"
            icon: mdi:baby-bottle
            icon_color: blue
          # Bottles list for selected day
          - type: markdown
            title: Bottles
            content: "{{ state_attr('sensor.baby_selected_day_bottles', 'markdown') }}"
          # Solids list for selected day
          - type: markdown
            title: Solids
            content: "{{ state_attr('sensor.baby_selected_day_solids', 'markdown') }}"
          - type: custom:apexcharts-card
            header:
              title: 7-Day Daily Totals
              show: true
            graph_span: 7d
            span:
              end: day
            apex_config:
              chart:
                height: 200
              plotOptions:
                bar:
                  columnWidth: '60%'
                  borderRadius: 4
              yaxis:
                min: 0
                labels:
                  formatter: |
                    EVAL:function(val) { return Math.round(val) + ' ml (' + (val / 29.5735).toFixed(1) + ' oz)'; }
              xaxis:
                type: datetime
                labels:
                  datetimeFormatter:
                    day: ddd
            series:
              - entity: sensor.your_baby_feedings_7_day_totals
                type: column
                name: Daily Total
                color: '#89b4fa'
                data_generator: |
                  const totals = entity.attributes.daily_totals;
                  if (!totals || totals.length === 0) return [];
                  return totals.map(([date, amount]) => {
                    return [new Date(date + 'T12:00:00').getTime(), amount];
                  });
                show:
                  legend_value: false
          - type: markdown
            content: >
              [View full feeding history in Baby Buddy](http://YOUR_HA_IP:8000/feedings/)

      # Growth Details Popup
      - type: vertical-stack
        cards:
          - type: custom:bubble-card
            card_type: pop-up
            hash: '#growth-details'
            name: Growth History
            icon: mdi:chart-line
            width_desktop: 600px
          # Metric measurements
          - type: conditional
            conditions:
              - condition: state
                entity: input_boolean.baby_display_imperial
                state: "off"
            card:
              type: entities
              title: Latest Measurements (Metric)
              entities:
                - entity: sensor.your_baby_last_weight_kg
                  name: Weight
                - type: attribute
                  entity: sensor.your_baby_last_weight
                  attribute: date
                  name: Weight Date
                - entity: sensor.your_baby_last_height_cm
                  name: Height
                - type: attribute
                  entity: sensor.your_baby_last_height
                  attribute: date
                  name: Height Date
                - entity: sensor.your_baby_last_head_cm
                  name: Head Circumference
                - type: attribute
                  entity: sensor.your_baby_last_head_circumference
                  attribute: date
                  name: Head Date
          # Imperial measurements
          - type: conditional
            conditions:
              - condition: state
                entity: input_boolean.baby_display_imperial
                state: "on"
            card:
              type: entities
              title: Latest Measurements (Imperial)
              entities:
                - entity: sensor.your_baby_last_weight_lb
                  name: Weight
                - type: attribute
                  entity: sensor.your_baby_last_weight
                  attribute: date
                  name: Weight Date
                - entity: sensor.your_baby_last_height_in
                  name: Height
                - type: attribute
                  entity: sensor.your_baby_last_height
                  attribute: date
                  name: Height Date
                - entity: sensor.your_baby_last_head_in
                  name: Head Circumference
                - type: attribute
                  entity: sensor.your_baby_last_head_circumference
                  attribute: date
                  name: Head Date
          # Weight History Chart (from Baby Buddy API data)
          - type: custom:apexcharts-card
            header:
              title: Weight History
              show: true
            graph_span: 6mo
            apex_config:
              chart:
                height: 150
              yaxis:
                labels:
                  formatter: |
                    EVAL:function(val) { return (val/1000).toFixed(1) + ' kg (' + (val/453.592).toFixed(1) + ' lb)'; }
              xaxis:
                type: datetime
            series:
              - entity: sensor.babybuddy_weight_history
                type: line
                name: Weight
                color: '#a6e3a1'
                stroke_width: 2
                data_generator: |
                  const results = entity.attributes.results;
                  if (!results || results.length === 0) return [];
                  return results.map(r => {
                    return [new Date(r.date).getTime(), r.weight];
                  }).sort((a, b) => a[0] - b[0]);
                show:
                  legend_value: false
          # Height History Chart (from Baby Buddy API data)
          - type: custom:apexcharts-card
            header:
              title: Height History
              show: true
            graph_span: 6mo
            apex_config:
              chart:
                height: 150
              yaxis:
                labels:
                  formatter: |
                    EVAL:function(val) { return val.toFixed(1) + ' cm (' + (val/2.54).toFixed(1) + ' in)'; }
              xaxis:
                type: datetime
            series:
              - entity: sensor.babybuddy_height_history
                type: line
                name: Height
                color: '#89b4fa'
                stroke_width: 2
                data_generator: |
                  const results = entity.attributes.results;
                  if (!results || results.length === 0) return [];
                  return results.map(r => {
                    return [new Date(r.date).getTime(), r.height];
                  }).sort((a, b) => a[0] - b[0]);
                show:
                  legend_value: false
          # Head Circumference History Chart (from Baby Buddy API data)
          - type: custom:apexcharts-card
            header:
              title: Head Circumference History
              show: true
            graph_span: 6mo
            apex_config:
