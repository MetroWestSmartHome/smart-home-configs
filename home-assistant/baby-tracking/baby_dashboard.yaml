              yaxis:
                labels:
                  formatter: |
                    EVAL:function(val) { return val.toFixed(1) + ' cm (' + (val/2.54).toFixed(1) + ' in)'; }
              xaxis:
                type: datetime
            series:
              - entity: sensor.babybuddy_head_history
                type: line
                name: Head
                color: '#f9e2af'
                stroke_width: 2
                data_generator: |
                  const results = entity.attributes.results;
