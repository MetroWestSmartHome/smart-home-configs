                  {% if states('input_number.baby_date_offset') | int < 0 %}purple{% else %}disabled{% endif %}
                tap_action:
                  action: call-service
                  service: input_number.increment
                  target:
                    entity_id: input_number.baby_date_offset
                layout: vertical
              - type: custom:mushroom-template-card
                primary: Today
                icon: mdi:calendar-today
                icon_color: green
                tap_action:
                  action: call-service
                  service: input_number.set_value
                  target:
                    entity_id: input_number.baby_date_offset
                  data:
                    value: 0
                layout: vertical
          # Selected day summary
          - type: custom:mushroom-template-card
            primary: "{{ states('sensor.baby_selected_day_sleep') }} sessions ({{ state_attr('sensor.baby_selected_day_sleep', 'total_hours') }} hr)"
            secondary: "{{ state_attr('sensor.baby_selected_day_sleep', 'nap_count') }} naps"
            icon: mdi:sleep
            icon_color: purple
          # Sleep list for selected day
          - type: markdown
            title: Sleep Sessions
            content: "{{ state_attr('sensor.baby_selected_day_sleep', 'markdown') }}"
          - type: custom:apexcharts-card
            header:
              title: 7-Day Sleep Totals
              show: true
            graph_span: 7d
            span:
              end: day
            apex_config:
              chart:
                height: 200
              plotOptions:
                bar:
                  columnWidth: '60%'
                  borderRadius: 4
              yaxis:
                min: 0
                labels:
                  formatter: |
                    EVAL:function(val) { return val.toFixed(1) + ' hr'; }
              xaxis:
                type: datetime
                labels:
                  datetimeFormatter:
                    day: ddd
            series:
              - entity: sensor.your_baby_sleep_7_day_totals
                type: column
                name: Daily Sleep
                color: '#cba6f7'
                data_generator: |
                  const totals = entity.attributes.daily_totals;
                  if (!totals || totals.length === 0) return [];
                  return totals.map(([date, hours]) => {
                    return [new Date(date + 'T12:00:00').getTime(), hours];
                  });
                show:
                  legend_value: false
          - type: markdown
            content: >
              [View full sleep history in Baby Buddy](http://YOUR_HA_IP:8000/sleep/)

      # --------------------------------------------------------------------------
      # DIAPER HISTORY POPUP
      # Diaper Popup (with date navigation)
      # --------------------------------------------------------------------------
      - type: vertical-stack
        cards:
          - type: custom:bubble-card
            card_type: pop-up
            hash: '#diaper-history'
            name: Diapers
            icon: mdi:paper-roll
            width_desktop: 600px
            trigger_entity: input_boolean.open_diaper_history
            trigger_state: 'on'
          # Date navigation header
          - type: horizontal-stack
            cards:
              - type: custom:mushroom-template-card
                icon: mdi:chevron-left
                icon_color: >
                  {% if states('input_number.baby_date_offset') | int > -6 %}amber{% else %}disabled{% endif %}
                tap_action:
                  action: call-service
                  service: input_number.decrement
                  target:
                    entity_id: input_number.baby_date_offset
                layout: vertical
              - type: custom:mushroom-template-card
                primary: "{{ states('sensor.baby_selected_date') }}"
                secondary: >
                  {% if state_attr('sensor.baby_selected_date', 'is_today') == 'True' %}Today{% endif %}
                icon: mdi:calendar
                icon_color: amber
                layout: vertical
              - type: custom:mushroom-template-card
                icon: mdi:chevron-right
                icon_color: >
                  {% if states('input_number.baby_date_offset') | int < 0 %}amber{% else %}disabled{% endif %}
                tap_action:
                  action: call-service
                  service: input_number.increment
                  target:
                    entity_id: input_number.baby_date_offset
                layout: vertical
              - type: custom:mushroom-template-card
                primary: Today
                icon: mdi:calendar-today
                icon_color: green
                tap_action:
                  action: call-service
                  service: input_number.set_value
                  target:
                    entity_id: input_number.baby_date_offset
                  data:
                    value: 0
                layout: vertical
          # Selected day summary
          - type: custom:mushroom-template-card
            primary: "{{ states('sensor.baby_selected_day_diapers') }} diapers"
            secondary: "{{ state_attr('sensor.baby_selected_day_diapers', 'dirty_count') }} dirty"
            icon: mdi:paper-roll
            icon_color: amber
          # Diaper list for selected day
          - type: markdown
            title: Diaper Changes
            content: "{{ state_attr('sensor.baby_selected_day_diapers', 'markdown') }}"
          - type: markdown
            content: >
              [View full diaper history in Baby Buddy](http://YOUR_HA_IP:8000/changes/)

      # Settings Popup - Sync status and manual triggers
      - type: vertical-stack
        cards:
          - type: custom:bubble-card
            card_type: pop-up
            hash: '#baby-settings'
            name: Baby Tracking Settings
            icon: mdi:cog
            width_desktop: 500px
          # Happiest Baby Section
          - type: custom:mushroom-template-card
            primary: Happiest Baby
            secondary: >
              Last: {{ states('input_datetime.happiest_baby_last_sync') | as_timestamp | timestamp_custom('%b %d %I:%M %p', true) if states('input_datetime.happiest_baby_last_sync') != 'unknown' else 'Never' }}
            icon: mdi:sleep
            icon_color: purple
          - type: custom:layout-card
            layout_type: custom:grid-layout
            layout:
              grid-template-columns: 3fr 1fr
              grid-template-rows: auto
            cards:
              - type: markdown
                content: >
                  **Status:** {{ states('input_text.happiest_baby_last_status') }}

                  **Next:** {{ (now().replace(hour=((now().hour // 3 + 1) * 3) % 24, minute=0, second=0)).strftime('%I:%M %p') }}
              - type: button
                name: Sync
                icon: mdi:sync
                tap_action:
                  action: call-service
                  service: script.sync_happiest_baby_manual
          # Lillio Section
          - type: custom:mushroom-template-card
            primary: Lillio
            secondary: >
              Last: {{ states('input_datetime.lillio_last_sync') | as_timestamp | timestamp_custom('%b %d %I:%M %p', true) if states('input_datetime.lillio_last_sync') != 'unknown' else 'Never' }}
            icon: mdi:school
            icon_color: blue
          - type: custom:layout-card
            layout_type: custom:grid-layout
            layout:
              grid-template-columns: 3fr 1fr
              grid-template-rows: auto
            cards:
              - type: markdown
                content: >
                  **Status:** {{ states('input_text.lillio_last_status') }}

                  **Next:** {% if now().weekday() < 5 and now().hour < 17 %}5:00 PM{% elif now().weekday() < 4 %}Tomorrow 5:00 PM{% else %}Mon 5:00 PM{% endif %}
              - type: button
                name: Sync
                icon: mdi:sync
                tap_action:
                  action: call-service
                  service: script.sync_lillio_manual

